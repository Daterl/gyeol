<script>

older="https://www.instagram.com/계정/"></label><label>원하는 느낌<textarea placeholder="짧고 담백하게."></textarea><p class="muted">빈칸이어도 시작할 수 있어요. 앱에서는 준비된 스냅샷만 사용해요.</p></details>`;

<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결 GYEOL — #34 화면 시안</title>
<style>
  :root{--paper:#f6f3ed;--ink:#1b1a18;--muted:#6d6862;--green:#2e5e4e;--line:#d5cec0;--card:#fffdf8;--soft:#e6efea}
  *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
  a{color:var(--green)}button,input,textarea,summary{font:inherit}button,a,summary{touch-action:manipulation}button,.button,summary{min-height:44px}button,.button{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border:1px solid var(--green);border-radius:10px;background:transparent;color:var(--green);text-decoration:none;font-weight:650;cursor:pointer}
  .primary{background:var(--green);color:var(--paper)}button:disabled{cursor:default;opacity:.6}:focus-visible{outline:3px solid var(--green);outline-offset:4px}.skip{position:absolute;top:-100px}.skip:focus{top:8px;left:8px;background:white;z-index:10;padding:12px}
  .review{background:#e6efea;border-bottom:1px solid var(--line);font-size:13px;padding:8px 24px;text-align:center}.review a{display:inline-flex;align-items:center;min-height:44px;margin:0 6px}
  header{border-bottom:1px solid var(--line)}.header-inner{max-width:1168px;margin:auto;display:flex;align-items:center;gap:12px;min-height:72px;padding:12px 24px}.brand{font-size:26px;font-weight:800}.wordmark{font:12px ui-monospace,monospace;letter-spacing:.16em}.tagline{margin-left:auto;font-size:14px;color:var(--muted)}
  main{max-width:1168px;margin:auto;padding:36px 24px 64px}h1,h2,h3,p{margin:0}h1{font-size:40px;line-height:1.25;letter-spacing:-.045em}h2{font-size:22px;line-height:1.4}h3{font-size:18px}.eyebrow{font-size:13px;font-weight:700;color:var(--green);letter-spacing:.08em;margin-bottom:14px}.sub{color:var(--muted);margin-top:14px}.intro{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:28px}.companion{position:relative;display:block;flex-shrink:0;width:112px;height:112px;overflow:hidden;border-radius:20px}.companion img{position:absolute;width:240%;height:auto;max-width:none;left:-10%;top:-7%}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}.section-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.count{font-size:14px;color:var(--muted)}.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;list-style:none;padding:0;margin:0}.photo{position:relative;overflow:hidden;aspect-ratio:1;border-radius:8px;background:var(--soft)}.photo img{width:300%;height:auto;max-width:none;position:absolute;top:0;left:calc(var(--i)*-100%)}.photo-label{margin-top:6px;font-size:13px;color:var(--muted)}.upload-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.hint{font-size:14px;color:var(--muted);margin-top:12px}.aside{display:grid;gap:18px}.aside .primary{width:100%}.aside h2{font-size:20px}.aside p{margin:12px 0 20px}.sample-link{display:block;text-align:center;min-height:44px;padding:10px}.optional-panel{grid-column:1/-1}.optional-panel .optional{margin-top:0;padding-top:0;border-top:0}.optional{margin-top:20px;padding-top:12px;border-top:1px solid var(--line)}summary{display:flex;align-items:center;cursor:pointer;color:var(--green);font-weight:600}summary:before{content:"＋";margin-right:8px}details[open]>summary:before{content:"−"}label{display:block;margin:12px 0 8px}input,textarea{width:100%;min-height:48px;border:1px solid var(--muted);border-radius:8px;padding:12px;background:var(--card);color:var(--ink)}
  .notice{padding:14px 18px;border-radius:12px;background:var(--soft);margin-bottom:24px;font-size:14px}.result-actions{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:24px}.result-actions .summary a{display:inline-flex;min-height:44px;align-items:center}.result-actions .summary{margin-right:auto;color:var(--muted);font-size:14px}.feed{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.slot{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.slot .photo{aspect-ratio:4/3}.slot-title{display:flex;align-items:center;gap:8px;margin:14px 0 10px}.number{flex-shrink:0;white-space:nowrap;font:13px ui-monospace,monospace;color:var(--muted)}.badge{display:inline-block;padding:4px 9px;border-radius:6px;font-size:13px;background:var(--soft);color:var(--green)}.omitted{background:#eee8f4;color:#554260}.caption{margin:12px 0;min-height:52px}.reason{font-size:14px;color:var(--muted)}.slot details{border-top:1px solid var(--line);margin-top:16px;padding-top:4px}.slot details p{font-size:14px;margin:4px 0 12px}.slot button{margin-top:10px}.footnote{font-size:13px;color:var(--muted);margin-top:24px;max-width:70ch}.play .intro{background:#eee8f4;border-radius:20px;padding:24px}.play .badge:not(.omitted){background:#ddeaab}.play .panel,.play .slot{border-color:#a9b994}.play .companion{width:136px;height:136px}.play .section-top{padding-bottom:12px;border-bottom:3px solid #ddeaab}.play .notice{background:#ecf1dc}
  @media(max-width:760px){.review{padding:6px 12px}.header-inner{padding:10px 20px;min-height:64px}.tagline{font-size:12px}main{padding:24px 20px 40px}h1{font-size:29px}.intro{gap:12px;margin-bottom:22px}.companion,.play .companion{width:72px;height:72px}.intro .sub{font-size:14px}.layout{grid-template-columns:1fr;gap:16px}.panel{padding:18px}.photos{gap:8px}.aside{gap:14px}.aside p{margin:10px 0 14px}.feed{grid-template-columns:1fr;gap:16px}.slot{display:grid;grid-template-columns:104px minmax(0,1fr);column-gap:16px}.slot .photo{aspect-ratio:1;grid-row:1/3}.slot-title{align-self:end;margin:0 0 8px}.slot .badge{justify-self:start;align-self:start}.slot .caption,.slot .reason,.slot details,.slot button{grid-column:1/-1}.slot .caption{min-height:0;margin:14px 0 6px}.slot details{margin-top:10px}.slot button{justify-self:start}.notice{padding:12px 14px;margin-bottom:16px}.result-actions{gap:10px;margin-bottom:16px}.result-actions .summary{width:100%}.result-actions .primary{flex:1}.play .intro{padding:16px}.footnote{margin-top:20px}}
  @media(max-width:359px){.companion,.play .companion,.tagline{display:none}main{padding-inline:16px}.header-inner{padding-inline:16px}h1{font-size:27px}.photos{gap:6px}.panel{padding:14px}.photo-label{font-size:12px}.slot{grid-template-columns:88px minmax(0,1fr);gap:12px}.result-actions .button{width:100%}.review a{margin-inline:4px}}
</style>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<div class="review">#34 정적 시안 · 기능 미구현 · AI 제작 예시 사진
  <nav aria-label="시안 비교"><a href="?view=input">A 입력</a><a href="?view=result">A 결과</a><a href="?view=input&direction=play">B 입력</a><a href="?view=result&direction=play">B 결과</a></nav>
</div>
<header><div class="header-inner"><span class="brand">결</span><span class="wordmark">GYEOL</span><span class="tagline">사진은 그대로, 흐름은 나답게</span></div></header>
<main id="main"></main>
<script>
  // Layout specimen only. No product state, API calls, or user-photo processing.
  const query = new URLSearchParams(location.search);
  const result = query.get('view') === 'result';
  const playful = query.get('direction') === 'play';
  document.body.classList.toggle('play', playful);
  const suffix = playful ? '&direction=play' : '';
  const names = ['잔이 놓인 테이블', '벽 위의 잎 그림자', '바다와 바위'];
  const photo = i => `<div class="photo" style="--i:${i}"><img src="sample-photos.png" alt="${names[i]} — AI 제작 시안 사진" width="2172" height="724"></div>`;
  const companion = '<span class="companion" aria-hidden="true"><img src="../concepts/gyeol-character-directions-v1.png" alt="" width="1536" height="1024"></span>';
  document.querySelector('main').innerHTML = result ? `
    <div class="intro"><div><p class="eyebrow">이렇게 이어봤어요</p><h1>빛을 따라, 잠깐의 여백</h1><p class="sub">순서도, 말도 고치세요. 마지막 선택은 당신의 몫입니다.</p></div>${companion}</div>
    <div class="notice"><strong>고정 샘플 결과</strong> · 개인화 정보 없이 사진을 바탕으로 제안하는 화면의 시안입니다.</div>
    <div class="result-actions"><p class="summary">사진 3장 · 캡션 제안 2장 · <a href="#empty-slot">비움 권장 1장</a></p><a class="button" href="?view=input${suffix}">사진으로 돌아가기</a><button class="primary" type="button" disabled>내보내기</button></div>
    <ol class="feed">
      <li class="slot">${photo(0)}<h2 class="slot-title"><span class="number">01</span>잔이 놓인 테이블</h2><span class="badge">제안됨</span><p class="caption">빛이 닿은 테이블, 한 잔.</p><p class="reason">캡션 문구는 수정할 수 있어요.</p><details><summary>근거 보기</summary><p>밝은 테이블과 잔을 시작에 놓았습니다. 실제 구현에서는 해당 사진의 근거를 표시합니다.</p></details></li>
      <li class="slot" id="empty-slot">${photo(1)}<h2 class="slot-title"><span class="number">02</span>벽 위의 잎 그림자</h2><span class="badge omitted">비움(권장)</span><p class="caption">이 사진은 말 없이 두어도 좋아요.</p><p class="reason">잎의 형태와 그림자가 보여서 설명을 덜어봤어요.</p><button type="button" disabled>그래도 채우기</button><details><summary>근거 보기</summary><p>테이블에서 바다로 넘어가는 사이에, 잎 그림자의 여백을 두었습니다. 시안용 수동 문구입니다.</p></details></li>
      <li class="slot">${photo(2)}<h2 class="slot-title"><span class="number">03</span>바다와 바위</h2><span class="badge">제안됨</span><p class="caption">바위 너머로 이어지는 바다.</p><p class="reason">캡션 문구는 수정할 수 있어요.</p><details><summary>근거 보기</summary><p>넓은 바다 사진을 마지막에 놓았습니다. 순서를 바꿔도 원래 제안 근거는 보존합니다.</p></details></li>
    </ol><p class="footnote">정적 시안: 내보내기·채우기·순서 변경은 아직 동작하지 않습니다. 위 근거는 시안용 수동 예시이며 실제 모델 분석 결과가 아닙니다. 본문과 버튼은 모두 HTML 텍스트입니다.</p>` : `
    <div class="intro"><div><p class="eyebrow">YOUR PHOTOS, YOUR FLOW</p><h1>좋아하는 사진들,<br>어떤 결로 이어볼까요?</h1><p class="sub">사진만 골라도 시작할 수 있어요.<br>어떤 순서로 놓고, 어디에 말을 덜지 함께 골라요.</p></div>${companion}</div>
    <div class="layout"><section class="panel" aria-labelledby="photos-heading"><div class="section-top"><h2 id="photos-heading">함께 놓을 사진</h2><span class="count">3 / 20장</span></div><ul class="photos">${names.map((name,i)=>`<li>${photo(i)}<p class="photo-label">${String(i+1).padStart(2,'0')} · ${name}</p></li>`).join('')}</ul><div class="upload-actions"><button type="button" disabled>사진 추가</button></div><p class="hint">사진 3~20장으로 시작해요. 사진 자체를 보정하지 않아요.</p></section>
    <aside class="aside"><section class="panel"><h2>이 사진들로 시작할게요</h2><p>순서를 제안하고, 사진마다 말을 붙이거나 비워둘 자리를 골라요.</p><a class="button primary" href="?view=result${suffix}">사진으로 결 만들기</a><p class="hint">현재 버튼은 결과 시안으로 이동합니다.</p></section><a class="sample-link" href="?view=result${suffix}">사진 없이 샘플 먼저 보기</a></aside><section class="panel optional-panel"><details class="optional"><summary>원하는 분위기도 알려줄래요? (선택)</summary><label for="own-url">내 인스타 URL (선택)</label><input id="own-url" type="url" placeholder="https://www.instagram.com/…"><label for="own-posts">기존 게시물 직접 업로드 (선택)</label><input id="own-posts" type="file" disabled><label for="reference-url">레퍼런스 인스타 URL (선택)</label><input id="reference-url" type="url" placeholder="https://www.instagram.com/…"><p class="hint">URL 지원 여부는 입력 후 안내해요. 시안에서는 URL을 수집하지 않습니다.</p><label for="identity">원하는 피드의 분위기 (선택)</label><textarea id="identity" placeholder="예: 짧은 말과 조용한 여백"></textarea><p class="hint">비워두면 사진만을 바탕으로 제안해요.</p></details></section></div>
    <p class="footnote">고정 샘플 3장이 놓인 입력 시안입니다. 사진 추가는 미구현이며 선택 입력은 서버로 전송되지 않습니다. 캐릭터는 기존 비교 보드의 배치 참고용입니다.</p>`;
</script>
</html>
